# Builds the Vite app and publishes the static output to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
# Token permissions the Pages deploy needs
permissions:
  contents: read
  pages: write
  id-token: write
# Finish one deploy before starting the next
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Install dependencies and build the site into dist/
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Hand dist/ to the deploy job
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
